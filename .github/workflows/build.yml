name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'experiment/apk-under-2mb']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm install --no-save sharp
      - run: |
          mkdir -p www/assets
          cp durga-puja-map.html www/index.html
          cp assets/durga-map-icon.svg www/assets/durga-map-icon.svg
          npx cap add android
      - name: Patch web page
        run: |
          sed -i 's#initMap();render();#window.__handle=handle;initMap();render();#' www/index.html
          sed -i 's#</body>#<script src="extra.js"></script></body>#' www/index.html
          cat > www/extra.js <<'EOF'
          (function(){
            var C=window.Capacitor;
            if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
            var P=C.registerPlugin('PhotoPicker');
            async function pickOriginalPhotos(){
              var r=await P.pick();
              return r.files.map(function(f){
                var bin=atob(f.data),u=new Uint8Array(bin.length);
                for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
                return new File([u],f.name,{type:(/\.json$/i.test(f.name)?'application/json':'image/jpeg')});
              });
            }
            async function pickOriginalFolder(){
              var r=await P.pickFolder();
              var files=r.files.slice().sort(function(a,b){
                var aj=/\.json$/i.test(a.name),bj=/\.json$/i.test(b.name);
                return aj===bj?String(a.name).localeCompare(String(b.name)):(aj?-1:1);
              });
              for(var i=0;i<files.length;i++){
                var f=files[i],data=await P.readFile({uri:f.uri,name:f.name});
                var bin=atob(data.data),u=new Uint8Array(bin.length);
                for(var j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);
                await window.__handle([new File([u],f.name,{type:(/\.json$/i.test(f.name)?'application/json':'image/jpeg')})]);
              }
              return true;
            }
            window.__pickOriginalPhotos=pickOriginalPhotos;
            window.__pickOriginalFolder=pickOriginalFolder;
            var fileButton=document.querySelector('label[for="files"]');
            fileButton.addEventListener('click',function(e){
              if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
              e.preventDefault();
              pickOriginalPhotos().then(window.__handle).catch(function(err){alert('File selection failed: '+(err.message||err))});
            });
            var folderButton=document.querySelector('label[for="folderFiles"]');
            folderButton.addEventListener('click',function(e){
              if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
              e.preventDefault();
              pickOriginalFolder().catch(function(err){alert('Folder selection failed: '+(err.message||err))});
            });
          })();
          EOF
      - name: Native code
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          D=android/app/src/main/java/com/barshan/durgamap
          cat > $D/PhotoPickerPlugin.java <<'EOF'
          package com.barshan.durgamap;

          import android.content.ClipData;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.provider.DocumentsContract;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          @CapacitorPlugin(name = "PhotoPicker")
          public class PhotoPickerPlugin extends Plugin {
            @PluginMethod
            public void readFile(PluginCall call) {
              String raw = call.getString("uri");
              if (raw == null || raw.isEmpty()) { call.reject("Missing file URI"); return; }
              try {
                Uri uri = Uri.parse(raw);
                InputStream in = getContext().getContentResolver().openInputStream(uri);
                if (in == null) { call.reject("Could not open selected file"); return; }
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                byte[] buf = new byte[65536]; int n;
                while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                in.close();
                JSObject out = new JSObject();
                out.put("name", call.getString("name", "photo.jpg"));
                out.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                call.resolve(out);
              } catch (Exception e) { call.reject("Could not read file", e); }
            }

            @PluginMethod
            public void pick(PluginCall call) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType("*/*");
              i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
              startActivityForResult(call, i, "onPicked");
            }

            @PluginMethod
            public void pickFolder(PluginCall call) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
              startActivityForResult(call, i, "onFolderPicked");
            }

            @ActivityCallback
            private void onFolderPicked(PluginCall call, ActivityResult result) {
              if (call == null) return;
              Intent data = result.getData();
              if (data == null || data.getData() == null) { call.reject("No folder selected"); return; }
              Uri tree = data.getData();
              try { getContext().getContentResolver().takePersistableUriPermission(tree, data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION)); } catch (Exception ignored) {}
              JSArray out = new JSArray();
              collectFiles(tree, tree, out, 0);
              JSObject ret = new JSObject();
              ret.put("files", out);
              call.resolve(ret);
            }

            private void collectFiles(Uri tree, Uri parent, JSArray out, int depth) {
              if (depth > 12 || out.length() > 5000) return;
              String parentId = parent.equals(tree) ? DocumentsContract.getTreeDocumentId(tree) : DocumentsContract.getDocumentId(parent);
              Uri children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, parentId);
              String[] cols = {DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE, DocumentsContract.Document.COLUMN_SIZE};
              try (Cursor c = getContext().getContentResolver().query(children, cols, null, null, null)) {
                if (c == null) return;
                while (c.moveToNext() && out.length() <= 5000) {
                  String id = c.getString(0), name = c.getString(1), mime = c.getString(2);
                  Uri child = DocumentsContract.buildDocumentUriUsingTree(tree, id);
                  if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mime)) {
                    collectFiles(tree, child, out, depth + 1);
                  } else if ((mime != null && (mime.startsWith("image/") || mime.equals("application/json") || name.toLowerCase().endsWith(".json")))) {
                    try {
                      JSObject o = new JSObject();
                      o.put("name", name == null ? "photo.jpg" : name);
                      o.put("uri", child.toString());
                      out.put(o);
                    } catch (Exception ignored) {}
                  }
                }
              } catch (Exception ignored) {}
            }

            @ActivityCallback
            private void onPicked(PluginCall call, ActivityResult result) {
              if (call == null) return;
              Intent data = result.getData();
              if (data == null) { call.reject("Nothing selected"); return; }
              List<Uri> uris = new ArrayList<>();
              ClipData cd = data.getClipData();
              if (cd != null) { for (int k = 0; k < cd.getItemCount(); k++) uris.add(cd.getItemAt(k).getUri()); }
              else if (data.getData() != null) uris.add(data.getData());
              JSArray out = new JSArray();
              for (Uri u : uris) {
                try {
                  Uri src = u;
                  try {
                    Uri m = MediaStore.getMediaUri(getContext(), u);
                    if (m != null) src = MediaStore.setRequireOriginal(m);
                  } catch (Exception ignored) {}
                  InputStream in;
                  try { in = getContext().getContentResolver().openInputStream(src); }
                  catch (Exception e) { in = getContext().getContentResolver().openInputStream(u); }
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[65536]; int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  String name = "photo.jpg";
                  Cursor c = getContext().getContentResolver().query(u, null, null, null, null);
                  if (c != null) { if (c.moveToFirst()) { int ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (ix >= 0) name = c.getString(ix); } c.close(); }
                  JSObject o = new JSObject();
                  o.put("name", name);
                  o.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                  out.put(o);
                } catch (Exception e) { }
              }
              JSObject ret = new JSObject();
              ret.put("files", out);
              call.resolve(ret);
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.barshan.durgamap;

          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PhotoPickerPlugin.class);
              super.onCreate(savedInstanceState);
              ActivityCompat.requestPermissions(this, new String[]{
                "android.permission.READ_MEDIA_IMAGES",
                "android.permission.ACCESS_MEDIA_LOCATION"
              }, 1);
            }
          }
          EOF
      - run: npx cap sync android
      - name: Generate Android launcher icons from the supplied thumbnail
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');
          const root = 'android/app/src/main/res';
          const source = 'assets/thumb.png';
          if (!fs.existsSync(source)) throw new Error('Required launcher artwork assets/thumb.png is missing');
          (async () => {
            const image = sharp(source).rotate().flatten({ background: '#2D0A0A' }).resize(512, 512, { fit: 'cover', position: 'centre' });
            const master = await image.png().toBuffer();
            for (const [density, size] of Object.entries({mdpi:48, hdpi:72, xhdpi:96, xxhdpi:144, xxxhdpi:192})) {
              const dir = path.join(root, 'mipmap-' + density);
              fs.mkdirSync(dir, {recursive:true});
              const icon = await sharp(master).resize(size, size).png().toBuffer();
              fs.writeFileSync(path.join(dir, 'ic_launcher.png'), icon);
              fs.writeFileSync(path.join(dir, 'ic_launcher_round.png'), icon);
            }
            const drawable = path.join(root, 'drawable-nodpi');
            fs.mkdirSync(drawable, {recursive:true});
            fs.writeFileSync(path.join(drawable, 'durga_launcher_foreground.png'), await sharp(master).resize(432,432).png().toBuffer());
            // Remove Capacitor's default Android robot vector so it cannot override the custom PNG.
            for (const base of ['drawable', 'drawable-anydpi', 'drawable-anydpi-v24', 'drawable-v24', 'drawable-nodpi']) {
              const vector = path.join(root, base, 'ic_launcher_foreground.xml');
              if (fs.existsSync(vector)) fs.unlinkSync(vector);
            }
            const adaptive = path.join(root, 'mipmap-anydpi-v26');
            fs.mkdirSync(adaptive, {recursive:true});
            const xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/durga_launcher_foreground"/></adaptive-icon>\n';
            fs.writeFileSync(path.join(adaptive,'ic_launcher.xml'),xml);
            fs.writeFileSync(path.join(adaptive,'ic_launcher_round.xml'),xml);
            const values = path.join(root,'values');
            fs.mkdirSync(values,{recursive:true});
            fs.writeFileSync(path.join(values,'ic_launcher_background.xml'),'<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#2D0A0A</color></resources>\n');
            console.log('Generated launcher icons from assets/thumb.png');
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
      - name: Enforce and verify launcher icon wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          import re
          s, n1 = re.subn(r'android:icon="[^"]+"', 'android:icon="@mipmap/ic_launcher"', s, count=1)
          s, n2 = re.subn(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher_round"', s, count=1)
          if n1 == 0:
              s, n1 = re.subn(r'<application\\b', '<application android:icon="@mipmap/ic_launcher"', s, count=1)
          if n2 == 0:
              s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', 1)
          p.write_text(s)
          required = [
              Path("android/app/src/main/res/mipmap-mdpi/ic_launcher.png"),
              Path("android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"),
              Path("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"),
              Path("android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml"),
              Path("android/app/src/main/res/drawable-nodpi/durga_launcher_foreground.png"),
          ]
          missing = [str(x) for x in required if not x.is_file() or x.stat().st_size == 0]
          default_vectors = list(Path("android/app/src/main/res").rglob("ic_launcher_foreground.xml"))
          if default_vectors:
              raise SystemExit("Default Android robot vector still exists: " + ", ".join(map(str, default_vectors)))
          if missing:
              raise SystemExit("Launcher icon resources missing: " + ", ".join(missing))
          print("Verified custom launcher PNGs and adaptive icon resources.")
          print("Manifest launcher references enforced: @mipmap/ic_launcher and @mipmap/ic_launcher_round")
          print(s[s.find("<application"):s.find("<application")+400])
          PY
      - name: Experimental APK size optimization (R8 and resource shrinking)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          # Apply minification to the experimental debug APK only. This keeps the same
          # app ID, web UI, plugin registration, permissions, and user-facing features.
          pattern = r'debug\\s*\\{'
          replacement = "debug {\\n            minifyEnabled true\\n            shrinkResources true\\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('Could not safely locate debug buildType in android/app/build.gradle; refusing to change build configuration')
          p.write_text(s2)
          rules = Path('android/app/proguard-rules.pro')
          existing = rules.read_text() if rules.exists() else ''
          keep = '''\n# Experimental safety keeps: Capacitor discovers native plugins by class/annotation.\n-keep class com.barshan.durgamap.PhotoPickerPlugin { *; }\n-keep class com.barshan.durgamap.MainActivity { *; }\n-keep class com.getcapacitor.** { *; }\n-keepclassmembers class * { @com.getcapacitor.annotation.PluginMethod <methods>; }\n'''
          rules.write_text(existing + keep)
          print('Enabled R8 minification and Android resource shrinking for experimental debug APK only.')
          PY
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: durga-map-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
