name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp "$(find . -name '*.html' -not -path './node_modules/*' -not -path './android/*' | head -n 1)" www/index.html
          
          npx cap add android
      - name: Add permissions and startup request
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/barshan/durgamap/MainActivity.java <<'EOF'
          package com.barshan.durgamap;

          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              ActivityCompat.requestPermissions(this, new String[]{
                "android.permission.READ_MEDIA_IMAGES",
                "android.permission.ACCESS_MEDIA_LOCATION"
              }, 1);
            }
          }
          EOF
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: durga-map-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
