name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp durga-puja-map.html www/index.html
          npx cap add android
      - name: Patch web page
        run: |
          sed -i 's#initMap();render();#window.__handle=handle;initMap();render();#' www/index.html
          sed -i 's#</body>#<script src="extra.js"></script></body>#' www/index.html
          cat > www/extra.js <<'EOF'
          (function(){
            var C=window.Capacitor;
            if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
            var P=C.registerPlugin('PhotoPicker');
            async function pickOriginalPhotos(){
              var r=await P.pick();
              return r.files.map(function(f){
                var bin=atob(f.data),u=new Uint8Array(bin.length);
                for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
                return new File([u],f.name,{type:(/\.json$/i.test(f.name)?'application/json':'image/jpeg')});
              });
            }
            async function pickOriginalFolder(){
              var r=await P.pickFolder();
              var files=r.files.slice().sort(function(a,b){
                var aj=/\.json$/i.test(a.name),bj=/\.json$/i.test(b.name);
                return aj===bj?String(a.name).localeCompare(String(b.name)):(aj?-1:1);
              });
              for(var i=0;i<files.length;i++){
                var f=files[i],data=await P.readFile({uri:f.uri,name:f.name});
                var bin=atob(data.data),u=new Uint8Array(bin.length);
                for(var j=0;j<bin.length;j++)u[j]=bin.charCodeAt(j);
                await window.__handle([new File([u],f.name,{type:(/\.json$/i.test(f.name)?'application/json':'image/jpeg')})]);
              }
              return true;
            }
            window.__pickOriginalPhotos=pickOriginalPhotos;
            window.__pickOriginalFolder=pickOriginalFolder;
            var fileButton=document.querySelector('label[for="files"]');
            fileButton.addEventListener('click',function(e){
              if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
              e.preventDefault();
              pickOriginalPhotos().then(window.__handle).catch(function(err){alert('File selection failed: '+(err.message||err))});
            });
            var folderButton=document.querySelector('label[for="folder"]');
            folderButton.addEventListener('click',function(e){
              if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
              e.preventDefault();
              pickOriginalFolder().catch(function(err){alert('Folder selection failed: '+(err.message||err))});
            });
          })();
          EOF
      - name: Native code
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          D=android/app/src/main/java/com/barshan/durgamap
          cat > $D/PhotoPickerPlugin.java <<'EOF'
          package com.barshan.durgamap;

          import android.content.ClipData;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.provider.OpenableColumns;
          import android.provider.DocumentsContract;
          import android.util.Base64;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.ArrayList;
          import java.util.List;

          @CapacitorPlugin(name = "PhotoPicker")
          public class PhotoPickerPlugin extends Plugin {
            @PluginMethod
            public void readFile(PluginCall call) {
              String raw = call.getString("uri");
              if (raw == null || raw.isEmpty()) { call.reject("Missing file URI"); return; }
              try {
                Uri uri = Uri.parse(raw);
                InputStream in = getContext().getContentResolver().openInputStream(uri);
                if (in == null) { call.reject("Could not open selected file"); return; }
                ByteArrayOutputStream bo = new ByteArrayOutputStream();
                byte[] buf = new byte[65536]; int n;
                while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                in.close();
                JSObject out = new JSObject();
                out.put("name", call.getString("name", "photo.jpg"));
                out.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                call.resolve(out);
              } catch (Exception e) { call.reject("Could not read file", e); }
            }

            @PluginMethod
            public void pick(PluginCall call) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType("*/*");
              i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
              startActivityForResult(call, i, "onPicked");
            }

            @PluginMethod
            public void pickFolder(PluginCall call) {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT_TREE);
              startActivityForResult(call, i, "onFolderPicked");
            }

            @ActivityCallback
            private void onFolderPicked(PluginCall call, ActivityResult result) {
              if (call == null) return;
              Intent data = result.getData();
              if (data == null || data.getData() == null) { call.reject("No folder selected"); return; }
              Uri tree = data.getData();
              try { getContext().getContentResolver().takePersistableUriPermission(tree, data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION)); } catch (Exception ignored) {}
              JSArray out = new JSArray();
              collectFiles(tree, tree, out, 0);
              JSObject ret = new JSObject();
              ret.put("files", out);
              call.resolve(ret);
            }

            private void collectFiles(Uri tree, Uri parent, JSArray out, int depth) {
              if (depth > 12 || out.length() > 5000) return;
              String parentId = parent.equals(tree) ? DocumentsContract.getTreeDocumentId(tree) : DocumentsContract.getDocumentId(parent);
              Uri children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, parentId);
              String[] cols = {DocumentsContract.Document.COLUMN_DOCUMENT_ID, DocumentsContract.Document.COLUMN_DISPLAY_NAME, DocumentsContract.Document.COLUMN_MIME_TYPE, DocumentsContract.Document.COLUMN_SIZE};
              try (Cursor c = getContext().getContentResolver().query(children, cols, null, null, null)) {
                if (c == null) return;
                while (c.moveToNext() && out.length() <= 5000) {
                  String id = c.getString(0), name = c.getString(1), mime = c.getString(2);
                  Uri child = DocumentsContract.buildDocumentUriUsingTree(tree, id);
                  if (DocumentsContract.Document.MIME_TYPE_DIR.equals(mime)) {
                    collectFiles(tree, child, out, depth + 1);
                  } else if ((mime != null && (mime.startsWith("image/") || mime.equals("application/json") || name.toLowerCase().endsWith(".json")))) {
                    try {
                      JSObject o = new JSObject();
                      o.put("name", name == null ? "photo.jpg" : name);
                      o.put("uri", child.toString());
                      out.put(o);
                    } catch (Exception ignored) {}
                  }
                }
              } catch (Exception ignored) {}
            }

            @ActivityCallback
            private void onPicked(PluginCall call, ActivityResult result) {
              if (call == null) return;
              Intent data = result.getData();
              if (data == null) { call.reject("Nothing selected"); return; }
              List<Uri> uris = new ArrayList<>();
              ClipData cd = data.getClipData();
              if (cd != null) { for (int k = 0; k < cd.getItemCount(); k++) uris.add(cd.getItemAt(k).getUri()); }
              else if (data.getData() != null) uris.add(data.getData());
              JSArray out = new JSArray();
              for (Uri u : uris) {
                try {
                  Uri src = u;
                  try {
                    Uri m = MediaStore.getMediaUri(getContext(), u);
                    if (m != null) src = MediaStore.setRequireOriginal(m);
                  } catch (Exception ignored) {}
                  InputStream in;
                  try { in = getContext().getContentResolver().openInputStream(src); }
                  catch (Exception e) { in = getContext().getContentResolver().openInputStream(u); }
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[65536]; int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  in.close();
                  String name = "photo.jpg";
                  Cursor c = getContext().getContentResolver().query(u, null, null, null, null);
                  if (c != null) { if (c.moveToFirst()) { int ix = c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if (ix >= 0) name = c.getString(ix); } c.close(); }
                  JSObject o = new JSObject();
                  o.put("name", name);
                  o.put("data", Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP));
                  out.put(o);
                } catch (Exception e) { }
              }
              JSObject ret = new JSObject();
              ret.put("files", out);
              call.resolve(ret);
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.barshan.durgamap;

          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PhotoPickerPlugin.class);
              super.onCreate(savedInstanceState);
              ActivityCompat.requestPermissions(this, new String[]{
                "android.permission.READ_MEDIA_IMAGES",
                "android.permission.ACCESS_MEDIA_LOCATION"
              }, 1);
            }
          }
          EOF
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: durga-map-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
